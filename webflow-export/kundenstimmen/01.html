    <figure class="ks__feat"><blockquote><p class="ks__ft">Auch nach dem Kauf top</p><p class="ks__fq">&#8222;Mein Kauf ist zwar schon eine Weile her, aber ich m&#246;chte nochmal die gute Beratung gerade nach dem Kauf betonen. Ich kam mir zwischenzeitlich schon nervig vor, aber mir wurde mit allem geholfen. Danke und ich freue mich schon auf den n&#228;chsten Kauf!!! Besonders danke ich Herrn Hein, der mir die Perspektive &#252;berhaupt verst&#228;ndlich und m&#246;glich gemacht hat.&#8220;</p></blockquote><figcaption><span class="ks__av">MK</span><b>Maiki Kunzig</b><span>Verifizierte Bewertung &#183; 26. Mai 2026</span></figcaption></figure>
    <div class="ks__grid"><figure class="ksc"><p class="ks__stars" aria-label="5 von 5 Sternen">&#9733;&#9733;&#9733;&#9733;&#9733;</p><blockquote><p class="ksc__t">Kompetente Beratung und immer erreichbar</p><p class="ksc__q">Kompetente Beratung und es wird sich viel Zeit genommen. Hatte meinen ersten Wohnungskauf und habe mich jederzeit gut informiert gef&#252;hlt. Aufkommende Probleme wurden sofort beachtet und es wurde eine L&#246;sung angestrebt. Ich werde wohl noch eine zweite Wohnung kaufen.</p></blockquote><figcaption><span class="ks__av">MG</span><div><b>Maik G.</b><span>Verifizierte Bewertung &#183; 27. Mai 2026</span></div></figcaption></figure><figure class="ksc"><p class="ks__stars" aria-label="5 von 5 Sternen">&#9733;&#9733;&#9733;&#9733;&#9733;</p><blockquote><p class="ksc__t">Kompetente Begleitung beim ersten Immobilienkauf</p><p class="ksc__q">Ich bin &#252;ber die Werbung auf Instagram auf die Signum Real Estate aufmerksam geworden und habe mich dort zum Thema Kapitalanlageimmobilien beraten lassen. Insgesamt war ich wirklich positiv &#252;berrascht. Die Beratung war verst&#228;ndlich, manchmal ohne Vorwissen etwas komplizierter, jedoch wurden meine wenigen Fragen geduldig beantwortet. Der Kaufprozess l&#228;uft bis hierhin transparent und strukturiert ab und ich habe mich aufgehoben gef&#252;hlt. Ich m&#246;chte mich bei Herrn Hein und dem gesamten Team bedanken. N&#228;chste Woche haben wir unseren Notartermin und wir freuen uns.</p></blockquote><figcaption><span class="ks__av">MK</span><div><b>Maiki Kunzig</b><span>Verifizierte Bewertung &#183; 14. Jan. 2026</span></div></figcaption></figure><figure class="ksc"><p class="ks__stars" aria-label="5 von 5 Sternen">&#9733;&#9733;&#9733;&#9733;&#9733;</p><blockquote><p class="ksc__t">Durchgehend gut begleitet</p><p class="ksc__q">Auch wenn sich der Prozess durch die Banken etwas l&#228;nger gezogen hat, wurde ich w&#228;hrend der gesamten Zeit gut begleitet und immer auf dem Laufenden gehalten. Herr Lettieri war jederzeit engagiert und erreichbar. Am Ende konnte ich erfolgreich eine Wohnung in Leipzig kaufen und bin jetzt gespannt auf die zuk&#252;nftige Entwicklung der Immobilie.</p></blockquote><figcaption><span class="ks__av">MS</span><div><b>Maxi S.</b><span>Verifizierte Bewertung &#183; 8. Mai 2026</span></div></figcaption></figure><figure class="ksc"><p class="ks__stars" aria-label="5 von 5 Sternen">&#9733;&#9733;&#9733;&#9733;&#9733;</p><blockquote><p class="ksc__t">Super Begleitung, bis zum Notar!</p><p class="ksc__q">Ich wurde von Signum sehr professionell beim Kauf meiner ersten Immobilie begleitet. Durch Herrn Lettieri habe ich mich von Anfang an gut verstanden und sicher gef&#252;hlt. Letzte Woche waren wir gemeinsam beim Notartermin. Eine sehr positive Erfahrung - ich freue mich auf die weitere Zusammenarbeit und empfehle Signum gerne weiter.</p></blockquote><figcaption><span class="ks__av">MH</span><div><b>Manuel H.</b><span>Verifizierte Bewertung &#183; 7. Feb. 2026</span></div></figcaption></figure><figure class="ksc"><p class="ks__stars" aria-label="5 von 5 Sternen">&#9733;&#9733;&#9733;&#9733;&#9733;</p><blockquote><p class="ksc__t">Wirkt sehr professionell und freundlich</p><p class="ksc__q">Ich hatte mit Salomon heute ein Gespr&#228;ch. Auch wenn ich die pers&#246;nlichen Voraussetzungen f&#252;r eine Immobilie noch nicht erf&#252;lle, war das Gespr&#228;ch sehr freundlich und informativ. Wir bleiben im Kontakt und sobald ich die Voraussetzungen erf&#252;lle, werde ich sicherlich wieder mit ihm weitere Informationen austauschen. Ich kann aus dem ersten Kontakt heraus eine Empfehlung aussprechen - es wirkte professionell und durchdacht.</p></blockquote><figcaption><span class="ks__av">DF</span><div><b>Dominik F.</b><span>Verifizierte Bewertung &#183; 10. Jan. 2026</span></div></figcaption></figure><figure class="ksc"><p class="ks__stars" aria-label="5 von 5 Sternen">&#9733;&#9733;&#9733;&#9733;&#9733;</p><blockquote><p class="ksc__t">Dieser Dienstleister ist nur zu empfehlen!</p><p class="ksc__q">So sollte der Service &#252;berall sein. Unser Ansprechpartner ist Herr Negusse, ein sehr sympathischer, engagierter, zielorientierter und auf Augenh&#246;he arbeitender Mitarbeiter der Signum Real Estate. Er k&#252;mmerte sich um den gesamten Ablauf, sobald Fragen waren wurden diese beantwortet oder fehlende Infos sehr z&#252;gig eingeholt. Wir freuen uns schon jetzt auf das n&#228;chste Projekt!</p></blockquote><figcaption><span class="ks__av">RS</span><div><b>Robert Stellmacher</b><span>Google-Rezension &#183; 2026</span></div></figcaption></figure></div>
